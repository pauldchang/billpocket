[build]
  publish = "outputs/bill-calendar-pwa"
command = ""

[[headers]]
for = "/csv-import.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/transaction-ui.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/transaction-splits.js"
[headers.values]
Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache"
